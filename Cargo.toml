# One workspace for all steps, so ESP-IDF downloads and builds once: run a step
# with `cargo run --release` from its directory.
[workspace]
resolver = "2"
members = ["esp32", "esp32/macros", "protocol", "01-hello", "02-identity", "03-light", "04-button"]
# The web pages build for the browser, the CLI and the slides for your
# computer, not the ESP32. Step 5 needs Bluetooth, which the other steps
# shouldn't carry, so it has its own ESP-IDF configuration and build.
exclude = ["web", "cli", "05-lamp", "slides", "quic-talk"]

[profile.release]
# Speed, not size: the app is ~4 MB of 8 MB flash, and the certificate checks
# (P-256/P-384 ECDSA in software) block the main task for seconds when
# size-optimized, long enough to trip the task watchdog.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on flash
opt-level = 3
lto = true
codegen-units = 1

[patch.crates-io]
# irpc with ESP32 fixes (portable-atomic for 32-bit targets; irpc-iroh without
# irpc's default features, which pull in ring). Not released yet.
irpc = { git = "https://github.com/n0-computer/irpc", rev = "39de17fc19cc5c77d17be2de33523e95ab40220d" }
irpc-iroh = { git = "https://github.com/n0-computer/irpc", rev = "39de17fc19cc5c77d17be2de33523e95ab40220d" }
