  <line x1="840" y1="150" x2="885" y2="150" stroke="#2563eb" stroke-width="2"/>

  <!-- Timer bar (position in loop) -->
  <rect x="0" y="296" width="0" height="3" fill="#9ca3af">
    <animate attributeName="width" from="0" to="1000" dur="20s" repeatCount="indefinite"/>
  </rect>
</svg>
