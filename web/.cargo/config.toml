# Build for the browser, not the ESP32 target set for the workspace above.
[build]
target = "wasm32-unknown-unknown"

# `ring` compiles C code for this target. The ambient CC is usually the host
# compiler (gcc), which produces objects the wasm linker cannot use.
[env]
CC_wasm32_unknown_unknown = "clang"

# getrandom 0.3 needs to be told to use the browser's crypto.getRandomValues,
# and web-sys only has Web Bluetooth (step 5) behind a cfg.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"', '--cfg', 'web_sys_unstable_apis']
